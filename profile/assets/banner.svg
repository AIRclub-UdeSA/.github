<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">AIR Club UdeSA</title>
  <desc id="desc">Banner institucional del club de inteligencia artificial y robótica de la Universidad de San Andrés.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0810"/>
      <stop offset="1" stop-color="#300b1c"/>
    </linearGradient>
    <linearGradient id="arm" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#8f5261"/>
      <stop offset="1" stop-color="#ddaabc"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#background)"/>
  <path d="M0 1h1200" stroke="#ddaabc" stroke-opacity=".35"/>
  <path d="M0 359h1200" stroke="#a40c4c" stroke-opacity=".65"/>

  <g fill="#faf8f8">
