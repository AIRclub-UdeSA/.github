    <text x="68" y="178" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="86" font-weight="900" letter-spacing="-4">AIR CLUB</text>
    <text x="72" y="226" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" letter-spacing="3">INTELIGENCIA ARTIFICIAL + ROBÓTICA</text>
    <text x="72" y="292" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" letter-spacing="1" opacity=".72">THINK. BUILD. COMPETE.</text>
